<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiryl Tarasenka — Projects</title>
  <meta name="description" content="Продукты, Telegram-боты и инфраструктура Кирилла Тарасенко. Products, Telegram bots and infrastructure by Kiryl Tarasenka.">
  <meta name="theme-color" content="#0b0d12">
  <meta property="og:title" content="Kiryl Tarasenka — Projects">
  <meta property="og:description" content="BatBus, Twig, Ghost Garden, Telegram bots and Nodex.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/img/batbus.jpg">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗂</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--a"></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__grid"></span>
  </div>

  <header class="topbar">
    <a class="topbar__brand" href="#top">KT<span>.</span></a>
    <nav class="topbar__nav">
      <a href="#products" data-i18n="nav.products"></a>
      <a href="#bots" data-i18n="nav.bots"></a>
      <a href="#infra" data-i18n="nav.infra"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
      <span class="lang__pill" aria-hidden="true"></span>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__photo" id="photo">
        <div class="photo__ring"></div>
        <div class="photo__frame">
          <img src="assets/photo.jpg" alt="Kiryl Tarasenka" onerror="this.remove()">
          <span class="photo__initials">KT</span>
        </div>
        <div class="photo__orbit" aria-hidden="true">
          <span>🚌</span><span>🌱</span><span>🌳</span><span>🤖</span><span>⚙️</span>
        </div>
      </div>

      <div class="hero__text">
        <p class="hero__hello reveal" data-i18n="hero.hello"></p>
        <h1 class="hero__name reveal" data-i18n="hero.name"></h1>
        <p class="hero__role reveal" data-i18n="hero.role"></p>
        <p class="hero__about reveal" data-i18n="hero.about"></p>
        <div class="hero__actions reveal">
          <a class="btn btn--primary" id="cv-link" href="#" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16" /></svg>
            <span data-i18n="hero.cv"></span>
          </a>
          <a class="btn btn--ghost" href="https://github.com/kitarasenka" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 19c-4 1.5-4-2-6-2.5m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1-.3-3.4 1.3a11.6 11.6 0 0 0-6 0C6.8 2.3 5.8 2.6 5.8 2.6a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4.4 9c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2v3.5" /></svg>
            GitHub
          </a>
        </div>
        <ul class="stats reveal" id="stats"></ul>
      </div>
    </section>

    <section class="section" id="products">
      <h2 class="section__title reveal"><span data-i18n="nav.products"></span></h2>
      <div class="products" id="products-list"></div>
    </section>

    <section class="section" id="bots">
      <h2 class="section__title reveal"><span data-i18n="nav.bots"></span></h2>
      <p class="section__lead reveal" data-i18n="bots.lead"></p>
      <div class="bots" id="bots-list"></div>
    </section>

    <section class="section" id="infra">
      <h2 class="section__title reveal"><span data-i18n="nav.infra"></span></h2>
      <div id="infra-list"></div>
    </section>
  </main>

  <footer class="footer">
    <p data-i18n="footer.text"></p>
    <a class="btn btn--primary btn--small" id="cv-link-footer" href="#" download>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16" /></svg>
      <span data-i18n="hero.cv"></span>
    </a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
