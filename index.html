<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kiryl Tarasenka — Senior React Native Engineer</title>
  <meta name="description" content="Kiryl Tarasenka — Senior React Native Engineer, 9+ years, 15 commercial apps, team lead on 4 of them. Pulsebit (1M+ installs), Mustread, CleverMe; brownfield migrations for e-commerce and retail.">
  <meta name="theme-color" content="#0b0d12">
  <meta property="og:title" content="Kiryl Tarasenka — Senior React Native Engineer">
  <meta property="og:description" content="9+ years building iOS and Android apps in React Native. Team lead on Pulsebit (1M+ installs), Mustread and CleverMe. Own products: BatBus (17K+ users), Twig, Ghost Garden.">
  <meta property="og:type" content="profile">
  <meta property="og:url" content="https://kitarasenka.github.io/cv/">
  <meta property="og:image" content="https://kitarasenka.github.io/cv/assets/photo.jpg">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230b0d12'/><text x='50' y='67' font-family='Arial Black,Arial' font-weight='900' font-size='46' text-anchor='middle' fill='%23b6f36a'>KT</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="progress" id="progress" aria-hidden="true"></div>
  <div class="bg" aria-hidden="true">
    <span class="bg__blob bg__blob--a"></span>
    <span class="bg__blob bg__blob--b"></span>
    <span class="bg__grid"></span>
  </div>

  <header class="topbar">
    <a class="topbar__brand" href="#top">KT<span>.</span></a>
    <nav class="topbar__nav">
      <a href="#apps" data-i18n="nav.apps"></a>
      <a href="#skills" data-i18n="nav.skills"></a>
      <a href="#experience" data-i18n="nav.experience"></a>
      <a href="#projects" data-i18n="nav.projects"></a>
    </nav>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ru">RU</button>
      <span class="lang__pill" aria-hidden="true"></span>
    </div>
    <a class="btn btn--small btn--ghost topbar__cta" href="#contact" data-i18n="nav.contact"></a>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero__text">
        <div class="hero__id reveal">
          <span class="hero__avatar">
            <span>KT</span>
            <img src="assets/photo.jpg" alt="Kiryl Tarasenka" onerror="this.remove()">
          </span>
          <p class="hero__hello" data-i18n="hero.hello"></p>
        </div>
        <h1 class="hero__role reveal" data-i18n="hero.role"></h1>
        <p class="hero__about reveal" data-i18n="hero.about"></p>
        <div class="hero__actions reveal">
          <a class="btn btn--primary magnetic" id="cv-link" href="#" download>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 19h16" /></svg>
            <span data-i18n="hero.cv"></span>
          </a>
          <a class="btn btn--ghost magnetic" id="hero-write" href="#contact" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 4-3 16-6-5-3 3v-5l9-8-11 6-4-2z" /></svg>
            <span data-i18n="hero.write"></span>
          </a>
        </div>
      </div>

      <aside class="proof reveal">
        <ul class="stats" id="stats"></ul>
        <p class="proof__title" data-i18n="hero.shipped"></p>
        <ul class="showcase" id="showcase"></ul>
      </aside>
    </section>

    <section class="section" id="apps">
      <p class="eyebrow reveal"><span>01</span> <span data-i18n="apps.eyebrow"></span></p>
      <h2 class="section__title reveal" data-i18n="apps.title"></h2>
      <p class="section__lead reveal" data-i18n="apps.lead"></p>
      <div class="apps" id="apps-list"></div>
      <p class="note reveal" data-i18n="apps.note"></p>
    </section>

    <section class="section" id="skills">
      <p class="eyebrow reveal"><span>02</span> <span data-i18n="skills.eyebrow"></span></p>
      <h2 class="section__title reveal" data-i18n="skills.title"></h2>
      <div class="skills" id="skills-list"></div>
      <h3 class="subsection subsection--small reveal" data-i18n="skills.stack"></h3>
      <ul class="stack reveal" id="stack"></ul>
    </section>

    <section class="section" id="experience">
      <p class="eyebrow reveal"><span>03</span> <span data-i18n="exp.eyebrow"></span></p>
      <h2 class="section__title reveal" data-i18n="exp.title"></h2>
      <p class="section__lead reveal" data-i18n="exp.lead"></p>
      <div class="exp" id="exp-list"></div>
    </section>

    <section class="section" id="projects">
      <p class="eyebrow reveal"><span>04</span> <span data-i18n="projects.eyebrow"></span></p>
      <h2 class="section__title reveal" data-i18n="projects.title"></h2>
      <p class="section__lead reveal" data-i18n="projects.lead"></p>
      <div class="pet-stats reveal" id="pet-stats"></div>
      <div class="products" id="products-list"></div>

      <h3 class="subsection reveal" data-i18n="bots.title"></h3>
      <p class="section__lead reveal" data-i18n="bots.lead"></p>
      <div class="bots" id="bots-list"></div>

      <h3 class="subsection reveal" data-i18n="infra.title"></h3>
      <div id="infra-list"></div>
    </section>

    <section class="section contact" id="contact">
      <div class="contact__card reveal">
        <p class="eyebrow"><span>05</span> <span data-i18n="contact.eyebrow"></span></p>
        <h2 class="contact__title" data-i18n="contact.title"></h2>
        <p class="contact__lead" data-i18n="contact.lead"></p>
        <div class="contact__actions" id="contact-actions"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 · <span data-i18n="footer.text"></span></p>
    <div class="footer__links" id="footer-links"></div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
